name: ci

on:
  push:
    branches: [dev]
  pull_request:

# Cancel superseded runs on the same ref: pushing twice in quick succession is not two
# full builds' worth of compute, and a red intermediate run has nothing to say.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (fmt, clippy, test, coverage, deny, trace)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: boma
          POSTGRES_PASSWORD: boma
          POSTGRES_DB: boma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=boma --dbname=boma"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BOMA_DATABASE_URL: postgres://boma:boma@127.0.0.1:5432/boma
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml, so CI and a developer machine use the same compiler.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-deny,cargo-machete,cargo-llvm-cov

      # Every integration test against the computer supervisor requires a daemon; ubuntu-24.04
      # ships one, and a silent miss would read as a flaky suite instead of a missing dependency.
      - name: docker daemon is reachable
        run: docker info

      # `--locked` everywhere: Cargo.lock is committed (AGENTS.md). A missing lock is a hard
      # failure on purpose, never a silent resolve. docs/STATE.md records that M0 cannot produce it.
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: test
        run: cargo nextest run --workspace --all-features --locked

      - name: coverage
        run: cargo llvm-cov --workspace --all-features --locked --summary-only --fail-under-lines 80

      - name: deny
        run: cargo deny check

      - name: unused dependencies
        run: cargo machete --with-metadata

      - name: traceability
        # Ratchet: the budget only decreases, milestone by milestone (docs/STATE.md).
        run: python3 tools/trace_check.py spec . --max-missing 16

      - name: secret scan
        run: python3 tools/secret_scan.py .

      # D-02: the reference exposed every captured mail on a development route. The obligation is
      # that no such route exists, so the route table is grepped, not just probed by a test.
      - name: no development mail route
        run: |
          # `route(` and not the bare path: a test may probe the path to prove it is unknown.
          if grep -rn --include='*.rs' 'route("/api/dev' crates/; then
            echo "a development mail route was registered" >&2
            exit 1
          fi

  web:
    name: web (build, typecheck, lint, playwright, golden, axe)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      # Build first: `next build` writes `next-env.d.ts` and `.next/types`, which `tsc --noEmit`
      # needs for CSS-module and route types on a fresh checkout.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint

      - run: npx playwright install --with-deps chromium
      # Runs the shell suite, the golden replay and axe together.
      - run: npm run test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  compose:
    # M0's last exit criterion: `docker compose up` migrates and serves. Reviewed-only YAML is not
    # evidence, so the stack is built and probed here on every push.
    name: compose (build, migrate, serve, health)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: build the image and start the stack
        run: docker compose up -d --build

      # `up -d` returns when the containers start, not when the API answers; the healthcheck inside
      # the image is the readiness signal, and the probe below is the observable one.
      - name: the API answers liveness, readiness and their aliases
        run: |
          set -euo pipefail
          probe() {
            for path in health ready healthz readyz; do
              curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused \
                --max-time 10 "http://127.0.0.1:3000/$path" -o "/tmp/boma-$path.json"
              printf '/%s ' "$path"
              cat "/tmp/boma-$path.json"
              printf '\n'
            done
          }
          if ! probe; then
            echo '::error::the stack did not answer; container logs follow'
            docker compose logs app
            exit 1
          fi

      - name: stop the stack and its volume
        if: always()
        run: docker compose down -v
