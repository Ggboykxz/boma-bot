name: ci

on:
  push:
    branches: [dev]
  pull_request:

# Cancel superseded runs on the same ref: pushing twice in quick succession is not two
# full builds' worth of compute, and a red intermediate run has nothing to say.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (fmt, clippy, test, coverage, deny, trace)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: boma
          POSTGRES_PASSWORD: boma
          POSTGRES_DB: boma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=boma --dbname=boma"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BOMA_DATABASE_URL: postgres://boma:boma@127.0.0.1:5432/boma
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml, so CI and a developer machine use the same compiler.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-deny,cargo-machete,cargo-llvm-cov

      # Every integration test against the computer supervisor requires a daemon; ubuntu-24.04
      # ships one, and a silent miss would read as a flaky suite instead of a missing dependency.
      - name: docker daemon is reachable
        run: docker info

      # The push provider (web-push -> ece -> openssl-sys) compiles against OpenSSL (REQ-064).
      # The runner ships libssl-dev; declare it so an image change never breaks the build.
      - name: openssl headers for the push provider
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev

      # `--locked` everywhere: Cargo.lock is committed (AGENTS.md). A missing lock is a hard
      # failure on purpose, never a silent resolve. docs/STATE.md records that M0 cannot produce it.
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: test
        run: cargo nextest run --workspace --all-features --locked

      - name: coverage
        run: cargo llvm-cov --workspace --all-features --locked --summary-only --fail-under-lines 80

      - name: deny
        run: cargo deny check

      - name: unused dependencies
        run: cargo machete --with-metadata

      - name: traceability
        # Ratchet: the budget only decreases, milestone by milestone (docs/STATE.md).
        run: python3 tools/trace_check.py spec . --max-missing 9

      - name: secret scan
        run: python3 tools/secret_scan.py .

      # D-02: the reference exposed every captured mail on a development route. The obligation is
      # that no such route exists, so the route table is grepped, not just probed by a test.
      - name: no development mail route
        run: |
          # `route(` and not the bare path: a test may probe the path to prove it is unknown.
          if grep -rn --include='*.rs' 'route("/api/dev' crates/; then
            echo "a development mail route was registered" >&2
            exit 1
          fi

  web:
    name: web (build, typecheck, lint, playwright, golden, axe)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      # Build first: `next build` writes `next-env.d.ts` and `.next/types`, which `tsc --noEmit`
      # needs for CSS-module and route types on a fresh checkout.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint

      - run: npx playwright install --with-deps chromium
      # Runs the shell suite, the golden replay and axe together.
      - run: npm run test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  desktop:
    # REQ-055: the Electron shell must install, typecheck, build and pack on every push; an
    # app that has never packed is a claim, not evidence. No GUI is needed for packing; no
    # certificate is referenced (the app is unsigned by decision, ADR-016; the update feed
    # stays inert until the owner signs). The Windows leg proves the NSIS installer and the
    # portable zip build on a real Windows runner — no Wine is involved anywhere.
    name: desktop (${{ matrix.os }} — install, typecheck, build, pack)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm run smoke
      - name: Pack (Linux, unpacked)
        if: runner.os == 'Linux'
        run: npm run dist
      - name: Pack (Windows, NSIS setup + portable zip)
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Upload the Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: boma-desktop-windows-${{ github.sha }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
          retention-days: 14

  compose:
    # M0's last exit criterion: `docker compose up` migrates and serves. Reviewed-only YAML is not
    # evidence, so the stack is built and probed here on every push.
    name: compose (build, migrate, serve, health)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: build the image and start the stack
        run: docker compose up -d --build

      # `up -d` returns when the containers start, not when the API answers; the healthcheck inside
      # the image is the readiness signal, and the probe below is the observable one.
      - name: the API answers liveness, readiness and their aliases
        run: |
          set -euo pipefail
          probe() {
            for path in health ready healthz readyz; do
              curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused \
                --max-time 10 "http://127.0.0.1:3000/$path" -o "/tmp/boma-$path.json"
              printf '/%s ' "$path"
              cat "/tmp/boma-$path.json"
              printf '\n'
            done
          }
          if ! probe; then
            echo '::error::the stack did not answer; container logs follow'
            docker compose logs app
            exit 1
          fi
          # REQ-055: the static export ships inside the image at BOMA_WEB_ROOT (ADR-013,
          # ADR-018); the probe below is the observable one for the web surface.
          for path in / /app/ /this-page-does-not-exist; do
            code=$(curl --silent --output /tmp/boma-web.html --write-out '%{http_code}' "http://127.0.0.1:3000${path}")
            echo "/${path#/} -> $code"
            head -c 60 /tmp/boma-web.html
            echo
            [ "$code" = "200" ] || [ "$code" = "404" ]
            if [ "$path" = "/this-page-does-not-exist" ]; then
              grep -q 'Page not' /tmp/boma-web.html || exit 1
            else
              grep -q '<title>Boma Bot</title>' /tmp/boma-web.html || exit 1
            fi
          done

      - name: stop the stack and its volume
        if: always()
        run: docker compose down -v

  chart:
    # The chart is the documented single-node path; a broken chart is no better than a broken compose.
    name: chart (helm lint + template)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo cp /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: lint the chart
        run: helm lint deploy/helm/boma-bot --set boma.masterKey=ci-lint-throwaway

      - name: render the in-cluster path
        run: helm template deploy/helm/boma-bot --set boma.masterKey=ci-lint-throwaway --set image.repository=boma-bot --set image.tag=0.2.0

      - name: render the external-postgres path
        run: helm template deploy/helm/boma-bot --set boma.masterKey=ci-lint-throwaway --set postgresql.enabled=false --set externalPostgres.dsn=postgres://boma:ci@example.com:5432/boma
