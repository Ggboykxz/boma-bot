name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: build the Linux artifacts and the release notes
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # keyless provenance attestation (Sigstore/Rekor)
      attestations: write # persist the attestation on the repository (REST requirement)
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the web client
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Build the Rust binary
        run: cargo build --release --locked --bin boma

      - name: Stage the desktop vendor (embedded Postgres, boma, web)
        run: bash tools/stage-desktop-vendor.sh linux

      - name: Assemble the server bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist staging/boma-${VERSION}
          cp target/release/boma staging/boma-${VERSION}/
          cp -r apps/web/out staging/boma-${VERSION}/web
          cp -r migrations staging/boma-${VERSION}/migrations
          cp README.md LICENSE CHANGELOG.md staging/boma-${VERSION}/
          cp docs/UPGRADING.md staging/boma-${VERSION}/UPGRADING.md
          tar -czf "dist/boma-${VERSION}-linux-x86_64.tar.gz" -C staging "boma-${VERSION}"

      - name: Pack the desktop shell (unpacked, unsigned)
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npx electron-builder --dir --linux
          ls dist
          tar -czf "../../dist/boma-desktop-${VERSION}-linux-x64.tar.gz" -C dist linux-unpacked

      - name: Write the checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Ensure there is something to publish
        run: ls -la dist

      - name: Attest provenance (Sigstore, keyless via OIDC)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "Boma Bot — persistent AI teammates on hardware you own."
            echo
            echo "What is in this release candidate: the v0.1.0 product, the improvement program through M15, and M35 — a fully self-contained desktop for Windows and Linux, like OpenBot. The pack carries the web export, the boma binary and embedded PostgreSQL 17.12.0; first launch initialises the data folder, applies migrations, starts the server and worker, and opens the app — no Docker, no system Postgres, no account. BOMA_DESKTOP_URL still pins an external origin. This is a release candidate; the owner smokes the Windows installer before v0.3.0 final."
            echo "(66 of 73 REQ ids are covered by tests carrying their id in the name; REQ-049 (voice), REQ-056 (mobile), REQ-068 (reassign), REQ-070 (Discord/WhatsApp fronts), REQ-071 (embedded browser), REQ-073 (themes), REQ-074 (first-party content) stay open by record.)"
            echo
            echo "Artifacts (hashes: SHA256SUMS.txt covers the Linux artifacts; SHA256SUMS-windows.txt covers the Windows artifacts — both are Sigstore-attested). The desktop-windows job uploads the Windows files to this release after the Linux job finishes:"
            echo
            echo "- boma-${VERSION}-linux-x86_64.tar.gz — the server: the boma binary, the static web build, migrations, README/LICENSE/CHANGELOG and docs/UPGRADING.md. Serve it with boma migrate && boma serve; see docs/UPGRADING.md."
            echo "- boma-desktop-${VERSION}-linux-x64.tar.gz — the Electron shell, unpacked and unsigned; see docs/UPGRADING.md (§Desktop). No auto-update; updates are manual."
            echo "- boma-desktop-${VERSION}-win-x64-setup.exe — the Windows installer (per-user by default; unsigned — see Verify)."
            echo "- boma-desktop-${VERSION}-win-x64-portable.zip — portable Windows build: unpack, run boma-desktop.exe."
            echo
            echo "Quality evidence: cargo test --workspace green (PG-backed leg included), UI goldens replayed, axe clean incl. RTL, coverage ≥ 80%, CI green on every push (rust, web, chart, compose, desktop on ubuntu-24.04 and windows-latest)."
            echo
            echo "Verify the downloads (no Apple/MS identity required — these are keyless Sigstore attestations, not code-signing certificates):"
            echo
            echo "  gh attestation verify boma-${VERSION}-linux-x86_64.tar.gz --repo Ggboykxz/boma-bot"
            echo "  gh attestation verify boma-desktop-${VERSION}-linux-x64.tar.gz --repo Ggboykxz/boma-bot"
            echo "  gh attestation verify boma-desktop-${VERSION}-win-x64-setup.exe --repo Ggboykxz/boma-bot"
            echo "  gh attestation verify boma-desktop-${VERSION}-win-x64-portable.zip --repo Ggboykxz/boma-bot"
            echo "  gh attestation verify SHA256SUMS.txt --repo Ggboykxz/boma-bot"
            echo "  gh attestation verify SHA256SUMS-windows.txt --repo Ggboykxz/boma-bot"
            echo
            echo "Everything else is in the repository: CHANGELOG.md, docs/PLAN.md, docs/TRACEABILITY.md (66/73 REQ ids in test names), docs/adr/ (29 decisions)."
          } > release-notes.md
          mkdir -p release-assets
          cp dist/* release-assets/
          cp release-notes.md release-assets/

      - name: Upload the Linux assets and the notes
        uses: actions/upload-artifact@v4
        with:
          name: boma-release-linux-${{ github.sha }}
          path: release-assets/*
          retention-days: 14

  desktop-windows:
    name: build and boot-test the Windows desktop
    needs: build-linux
    runs-on: windows-latest
    permissions:
      contents: write # upload the assets to the release
      id-token: write # keyless provenance attestation
      attestations: write # persist the attestation on the repository
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build the web client
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: "Install OpenSSL for openssl-sys (web-push to ece)"
        shell: bash
        run: vcpkg install openssl:x64-windows-static-md
      - name: Stage the desktop vendor (embedded Postgres, boma, web)
        run: bash tools/stage-desktop-vendor.sh windows
        shell: bash
        env:
          VCPKG_ROOT: C:\vcpkg

      - name: Build the Windows pack (NSIS setup + portable zip)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          npm run dist:win

      - name: Install the boot-test runner
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install chromium

      - name: Unpack the portable build for the boot test
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "apps/desktop/dist" -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { throw "no portable zip in apps/desktop/dist" }
          Expand-Archive -Path $zip.FullName -DestinationPath "${{ runner.temp }}/boma-boot" -Force

      - name: Boot-test the packaged app before publishing
        id: boot
        working-directory: apps/web
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "${{ runner.temp }}/boma-boot" -Filter "Boma Bot.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "no 'Boma Bot.exe' in the portable zip" }
          node tools/windows-boot-smoke.mjs $exe.FullName

      - name: Upload the boot evidence (always — even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boma-windows-boot-${{ github.sha }}
          path: apps/web/test-results/windows-boot
          if-no-files-found: warn
          retention-days: 14

      - name: Write the Windows checksums
        working-directory: apps/desktop/dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum *.exe *.zip > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt

      - name: Attest provenance (Sigstore, keyless via OIDC)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
            apps/desktop/dist/SHA256SUMS-windows.txt

      - name: Verify the attestations (the exact commands a stranger would run)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for file in apps/desktop/dist/*.exe apps/desktop/dist/*.zip apps/desktop/dist/SHA256SUMS-windows.txt; do
            gh attestation verify "$file" --repo Ggboykxz/boma-bot
          done

      - name: Upload the Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: boma-release-windows-${{ github.sha }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
            apps/desktop/dist/SHA256SUMS-windows.txt
          retention-days: 14

  desktop-boot-linux:
    name: boot-test the Linux desktop pack
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the web export
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: boma-release-linux-${{ github.sha }}
          path: release-assets
      - name: Unpack the Linux desktop tarball
        run: |
          set -euo pipefail
          mkdir -p /tmp/boma-desktop-linux
          tar -xzf release-assets/boma-desktop-*-linux-x64.tar.gz -C /tmp/boma-desktop-linux
          ls /tmp/boma-desktop-linux
      - name: Rehearse the embedded stack boot with the released binary
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/vendor/boma apps/desktop/vendor/web
          cp release-assets/boma-*-linux-x86_64.tar.gz /tmp/server.tar.gz
          mkdir -p /tmp/server && tar -xzf /tmp/server.tar.gz -C /tmp/server
          BOMA_BIN="$(find /tmp/server -type f -name boma | head -1)"
          cp "$BOMA_BIN" apps/desktop/vendor/boma/boma
          bash tools/fetch-embedded-postgres.sh apps/desktop/vendor/postgres linux
          mv apps/desktop/vendor/postgres/linux/* apps/desktop/vendor/postgres/
          cp -r apps/web/out/. apps/desktop/vendor/web/
          bash tools/desktop-stack-smoke.sh apps/desktop/vendor

  publish:
    name: publish the tested release
    needs: [build-linux, desktop-windows, desktop-boot-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: boma-release-linux-${{ github.sha }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: boma-release-windows-${{ github.sha }}
          path: release-assets
      - name: Create the release from the tested artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la release-assets
          gh release create "${GITHUB_REF_NAME}" \
            --title "Boma Bot ${GITHUB_REF_NAME}" \
            --notes-file release-assets/release-notes.md \
            release-assets/boma-* release-assets/SHA256SUMS*.txt
