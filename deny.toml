[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # No fixed release exists upstream (rsa >= 0.10.0-rc both flagged on 2026-11-15). The path
  # is jwt-simple -> superboring -> rsa (web-push). JWT-simple does RSA *verify* only; we never
  # decrypt with RSA anywhere in the tree, and the Marvin sidechannel targets PKCS#1 v1.5
  # decryption oracles, so the exploitable primitive is absent. Owner-visible: review on
  # every web-push/jwt-simple upgrade. (2026-11-15)
  "RUSTSEC-2023-0071",
  # Fix requires elliptic-curve 0.14.3's constant-time fixes. The fix chain reaches via
  # jwt-simple >=0.13; web-push v0.11.0 pins jwt-simple ^0.12.11 and cannot move without an
  # upstream release. The affected constant-time paths are arithmetic over the deployment's
  # VAPID service-identity key (used for outbound push signatures on one host); theft of this
  # key lets an attacker send pushes through the deployment's identity, never to read mail,
  # conversations or secrets. Revisit when web-push/jwt-simple upgrade. (2026-11-15)
  "RUSTSEC-2026-0387",
  # chrono (RUSTSEC-2026-0543) and chrono-tz (RUSTSEC-2026-0555) were flagged unmaintained on
  # 2026-11-17: no vulnerability, no fixed release, and the upstream advisory itself says
  # "No safe upgrade is available". They are used for RFC3339 rendering, cron windows and the
  # IANA timezone of routines. Migrating to jiff/time is a separate, breaking change; it is
  # tracked as a proposal in docs/STATE.md. Only these two advisory IDs are ignored; every
  # other advisory, yank, ban and licence check stays at deny. (2026-11-17)
  "RUSTSEC-2026-0543",
  "RUSTSEC-2026-0555",
]

[licenses]
version = 2
confidence-threshold = 0.9
# Compatible with an open-source release; the owner picks the final licence for this project.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  # The Mozilla root store shipped by webpki-roots (pulled in by sqlx's rustls feature).
  # CDLA-Permissive-2.0 is permissive and compatible with the project's own licence.
  "CDLA-Permissive-2.0",
  # bzip2 v1.0.6 library+tool licence (pulled in by the zip crate's bzip2 feature, analysed
  # by the all-features graph). Permissive, BSD-like; compatible with the project's licence.
  "bzip2-1.0.6",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
