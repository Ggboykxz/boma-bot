{{- /* In-cluster database: single-pod, throwaway bring-up only.
       For anything real: point externalPostgres.dsn at a Postgres you own, or use compose. */ -}}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boma-bot.fullname" . }}-db
  labels:
    {{- include "boma-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  BOMA_DATABASE_URL: postgres://{{ .Values.postgresql.user }}:{{ .Values.postgresql.password }}@{{ include "boma-bot.fullname" . }}-db:5432/{{ .Values.postgresql.database }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "boma-bot.fullname" . }}-db
  labels:
    {{- include "boma-bot.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgresql.storage | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boma-bot.fullname" . }}-db
  labels:
    {{- include "boma-bot.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "boma-bot.name" . }}-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "boma-bot.name" . }}-db
        {{- include "boma-bot.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          command:
            - postgres
            - -c
            - statement_timeout=5000
            - -c
            - idle_in_transaction_session_timeout=30000
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "boma-bot.fullname" . }}-db
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
          readinessProbe:
            exec:
              command: ["pg_isready", "--username", {{ .Values.postgresql.user | quote }}, "--dbname", {{ .Values.postgresql.database | quote }}]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "boma-bot.fullname" . }}-db
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "boma-bot.fullname" . }}-db
  labels:
    {{- include "boma-bot.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "boma-bot.name" . }}-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
{{- end }}
{{- if and (not .Values.postgresql.enabled) (.Values.externalPostgres.dsn) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boma-bot.fullname" . }}-db
  labels:
    {{- include "boma-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  BOMA_DATABASE_URL: {{ .Values.externalPostgres.dsn | quote }}
{{- end }}
