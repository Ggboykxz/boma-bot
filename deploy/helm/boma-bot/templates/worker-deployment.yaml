{{- /* worker Deployment — the claim loop that drains the run queue */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boma-bot.fullname" . }}-worker
  labels:
    {{- include "boma-bot.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "boma-bot.name" . }}-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "boma-bot.name" . }}-worker
        {{- include "boma-bot.labels" . | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: {{ include "boma-bot.fullname" . }}-env
            - secretRef:
                name: {{ include "boma-bot.fullname" . }}-db
            - secretRef:
                name: {{ include "boma-bot.fullname" . }}-master-key
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
