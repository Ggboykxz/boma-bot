{{- /* Secret with the master vault key — required, fail fast if missing */ -}}
{{- if not .Values.boma.masterKey }}
  {{- fail "boma.masterKey must be set (helm --set boma.masterKey=…); generate with python3 -c 'import secrets; print(secrets.token_hex(32))'" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boma-bot.fullname" . }}-master-key
  labels:
    {{- include "boma-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  BOMA_MASTER_KEY: {{ .Values.boma.masterKey | quote }}
