[workspace]
resolver = "3"
members = [
  "crates/domain",
  "crates/app",
  "crates/infra",
  "crates/api",
  "crates/bin",
  "crates/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# sqlx 0.9 declares rust-version 1.94, so the workspace MSRV cannot be lower.
rust-version = "1.94"
license-file = "LICENSE"
authors = ["Boma Bot contributors"]
repository = "https://example.invalid/boma/boma"
publish = false

# Versions below were resolved from the crates.io API on 2026-11-12 (max_stable_version),
# never typed from memory. `cargo update` may move them; docs/STATE.md records the date.
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
http-body-util = "0.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "migrate",
  "macros",
  "json",
  "uuid",
  "time",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "limit", "cors", "set-header", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["macros"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

# Internal crates.
boma-api = { path = "crates/api" }
boma-app = { path = "crates/app" }
boma-domain = { path = "crates/domain" }
boma-infra = { path = "crates/infra" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Allowed deliberately, both documented in AGENTS.md "Rust standards":
#   doc_markdown      - we write "SQLx", "Postgres", "Boma Bot" as prose, not as code spans.
#   module_name_repetitions - `domain::DomainError` and `run::RunStatus` stay explicit on purpose,
#                             because every crate re-exports these names at its root.
doc_markdown = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
overflow-checks = true

[profile.bench]
inherits = "release"
strip = "none"
